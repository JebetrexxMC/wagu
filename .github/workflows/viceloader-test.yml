# 4.13.64: VICE Loader overlay test on an Android emulator (x86_64 Android 11 with ARM translation).
# Screenshots of every page, logcat and the crash logs are uploaded as the "viceloader-test" artifact.
name: VICE Loader emulator test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag with ViceLoader.apk'
        required: false
        default: 'v4.13.64'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: test
      - name: Download ViceLoader.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" -p ViceLoader.apk && ls -l ViceLoader.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the overlay test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash test/viceloader_emulator_test.sh ViceLoader.apk
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viceloader-test
          path: out/

# MP Launcher (PC, Tauri 2 from the JebetrexxMC/tauri fork): Windows exe + NSIS installer
name: MP Launcher

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: launcher
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/src-tauri/target
          key: launcher-win-${{ hashFiles('launcher/src-tauri/Cargo.lock') }}
      - name: 32-bit target (gta_sa.exe is 32-bit, the injection needs the same architecture)
        run: rustup target add i686-pc-windows-msvc
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: build
        working-directory: launcher/src-tauri
        run: cargo tauri build --target i686-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: mp-launcher-windows
          path: |
            launcher/src-tauri/target/i686-pc-windows-msvc/release/*.exe
            launcher/src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 30

name: CoopFusion32 (AML mod, armeabi-v7a)
on:
  push:
    paths:
      - 'coopfusion/**'
      - '.github/workflows/coopfusion.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            coopfusion
            .github
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - name: ndk-build libCoopFusion32.so
        working-directory: coopfusion/CoopFusion32
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x build.sh
          ./build.sh -j"$(nproc)"
          ls -la libs/armeabi-v7a/
      - name: Server syntax check
        run: node --check coopfusion/CoopFusion32/coopfusion/server/index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: libCoopFusion32
          path: coopfusion/CoopFusion32/libs/armeabi-v7a/libCoopFusion32.so

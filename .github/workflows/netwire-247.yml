# MP NetWire 24/7 (net/): probes every wire - region brokers (HiveMQ), public lobby (Mosquitto /
# HiveMQ / EMQX), EMQX ports, region VPS game ports, Oracle / XDP / relay boxes, MP Crossplay (open.mp),
# the default + featured + custom servers in the MP lobby and the top open.mp / SA-MP servers - every
# 5 minutes and force-pushes the result to the `netwire-status` branch (one commit, main stays clean):
# wires.json, history.json (24 h), netwire.svg (README card) and badge-*.json (shields.io endpoint badges).
# The page mpsamp-open.github.io/network.html reads the same files.
# Same long-shift pattern as live-status.yml: one run stays up ~5h50m and loops itself; the cron only
# starts the next shift (queued, never cancelling the running one), so the status never stops.
# A new wire = a new line in net/wires.txt; the next round picks it up (the file is re-read).
# Pings are measured from the GitHub runner (US / EU data centres), not from a phone: use them to see
# what is up and which path is fastest, not as the ping a player in the Philippines gets.
# Turn it off: repository variable NETWIRE = off.
name: MP NetWire 24/7

on:
  push:
    branches: [main]
    paths: ['net/**', '.github/workflows/netwire-247.yml']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      shift:
        description: 'Run the 24/7 status loop (off = build + test only)'
        required: false
        default: 'on'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /net/
            /src/net/
          sparse-checkout-cone-mode: false
      - name: Build (host)
        run: make -C net
      - name: Test (parser, probes, relay)
        run: make -C net test
      - name: Build for Android (Termux / adb shell)
        run: make -C net android NDK=$ANDROID_NDK_LATEST_HOME && ls -la net/build/android/*/mpnetd
      - name: One probe round
        run: |
          python3 net/tools/sources.py 10 > dyn.txt || true
          net/build/mpnetd probe -w net/wires.txt -w dyn.txt --from "GitHub Actions (build check)" -o wires.json || true
          python3 - <<'PY'
          import json; d = json.load(open("wires.json"))
          print("%d wires, %d probed, %d up, %d green" % (d["total"], d["probed"], d["up"], d["green"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mpnetd
          path: |
            net/build/mpnetd
            net/build/android
          retention-days: 14

  swift:
    # MPNet Swift package (Moya): build + tests on macOS, only when the code changes (not every cron round)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net/swift
      - name: swift build + test
        working-directory: net/swift
        run: swift build && swift test

  rust:
    # mpnet-agent (Rust: tokio + bore from the JebetrexxMC forks) + shell scripts, only when the code changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            net/rust/target
          key: rust-${{ hashFiles('net/rust/Cargo.lock') }}
      - name: cargo build
        working-directory: net/rust
        run: cargo build --release --locked
      - name: scripts (bash -n)
        run: for f in net/manage/*.sh net/rustscan/*.sh net/zerotier/*.sh net/sniffnet/*.sh; do bash -n "$f"; done
      - name: probe + scan + bore tunnel
        working-directory: net
        run: |
          A=rust/target/release/mpnet-agent
          timeout 60 $A probe -w wires.txt | tail -20
          python3 -m http.server 19050 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          $A scan 127.0.0.1 -p 19000-19100
          $A bore-server --min-port 20000 --max-port 20010 >/tmp/bs.log 2>&1 &
          sleep 1
          timeout 20 $A tunnel --local-port 19050 --to 127.0.0.1 >/tmp/bt.log 2>&1 &
          sleep 3; cat /tmp/bt.log
          P=$(grep -o '127.0.0.1:[0-9]*' /tmp/bt.log | head -1)
          curl -fsS -o /dev/null -w "through bore: %{http_code}\n" "http://$P/"
          $A reflect --bind 127.0.0.1:7790 & sleep 1
          python3 tests/udp_ping.py 127.0.0.1 7790
          $A ping 127.0.0.1:7790 -c 3
          $A ping 127.0.0.1:7790 -c 2 --samp
      - name: samp-udp-proxy (fork, WIP upstream) builds
        run: |
          git clone -q --depth 1 https://github.com/JebetrexxMC/samp-udp-proxy /tmp/sup
          cd /tmp/sup && cargo build --release

  p2p:
    # mpnet-p2p (rust-libp2p fork): two nodes, one hosts a server, the other must see it + ping it
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net/p2p
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            net/p2p/target
          key: p2p-${{ hashFiles('net/p2p/Cargo.lock') }}
      - working-directory: net/p2p
        run: |
          cargo build --release --locked
          B=target/release/mpnet-p2p
          $B --port 4101 --server 127.0.0.1:7777 --name "CI LAN" --no-mdns --seconds 15 > /tmp/a.log &
          sleep 2
          $B --port 4102 --no-mdns --dial /ip4/127.0.0.1/tcp/4101 --seconds 10 | tee /tmp/b.log
          grep -q '"event":"server".*127.0.0.1:7777' /tmp/b.log && grep -q '"event":"ping"' /tmp/b.log

  go:
    # mpedge (gnet fork): vet, build, ping check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: net/go/go.sum
      - name: build + ping
        working-directory: net/go
        run: |
          go vet ./... && go build -o /tmp/mpedge ./mpedge
          /tmp/mpedge -listen 127.0.0.1:7791 -backend 127.0.0.1:7792 & sleep 1
          python3 ../tests/udp_ping.py 127.0.0.1 7791

  mplatency:
    # 5.02.65: mplatency (24/7 latency + location monitor) built with Go 1.27.4 from the wagu release
    # v5.02.64 (go1.27.4.src.tar.gz, built from source with the runner's Go as bootstrap), tested, and
    # cross-compiled for Linux / Termux / Windows / macOS. The binaries are uploaded as an artifact.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Go 1.27.4 from the wagu release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download v5.02.64 -R "$GITHUB_REPOSITORY" -p go1.27.4.src.tar.gz -D /tmp
          tar xzf /tmp/go1.27.4.src.tar.gz -C /tmp
          cd /tmp/go/src && GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash > /tmp/make.log 2>&1 || { tail -40 /tmp/make.log; exit 1; }
          echo "/tmp/go/bin" >> "$GITHUB_PATH"
      - name: vet + test + build
        working-directory: net/go
        run: |
          set -e
          go version | grep -q go1.27.4
          go vet ./mplatency && go test -count=1 ./mplatency
          mkdir -p /tmp/mpl
          for t in linux/amd64 linux/arm64 linux/arm android/arm64 windows/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o /tmp/mpl/mplatency-$os-$arch$ext ./mplatency
          done
          ls -la /tmp/mpl
          timeout 90 /tmp/mpl/mplatency-linux-amd64 -once -rounds 3 -every 2s -wires ../wires.txt -json /tmp/lat.json || true
          python3 ../tools/render_latency.py /tmp/lat.json /tmp/mpl-card
          python3 -c "import json;d=json.load(open('/tmp/mpl-card/mplatency.json'));assert d['targets'] and d['round']==3"
      - uses: actions/upload-artifact@v4
        with:
          name: mplatency
          path: |
            /tmp/mpl/*
            /tmp/mpl-card/*

  native:
    # mpnet-dns (libevent), mpnet-ws (POCO), mpprobe.py (asyncio / uvloop / trio)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libevent-dev libpoco-dev
      - name: dns + ws
        run: |
          make -C net dns ws
          net/build/mpnet-dns net/wires.txt | head -c 600; echo
          echo '{"total":0}' > /tmp/w.json
          net/build/mpnet-ws -f /tmp/w.json -p 9090 & sleep 1
          curl -fsS http://127.0.0.1:9090/health; curl -fsS http://127.0.0.1:9090/wires.json
      - name: beast (fork headers) + query bridge
        run: |
          sudo apt-get install -y -qq libboost-dev
          git clone -q --depth 1 https://github.com/JebetrexxMC/beast /tmp/beast
          make -C net beast BEAST=/tmp/beast/include
          net/build/mpnet-beast -p 8092 & sleep 1
          curl -fsS http://127.0.0.1:8092/health
          curl -sS "http://127.0.0.1:8092/query?host=wap-fresh.tun.ply.gg&port=56616"; echo
      - name: handy reflector
        run: |
          sudo apt-get install -y -qq ninja-build
          cmake -S net/handy -B /tmp/hb -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/hb
          /tmp/hb/mpnet-handy --udp 7795 --http 8093 & sleep 1
          python3 net/tests/udp_ping.py 127.0.0.1 7795 && curl -fsS http://127.0.0.1:8093/stats
      - name: scripts + RaspAP plugin + pack_scan tests
        run: |
          for f in net/query-shield/*.sh net/cjdns/*.sh net/wireguard/*.sh net/ziti/*.sh net/raspap/*.sh; do bash -n "$f"; done
          sudo apt-get install -y -qq php-cli
          php -l net/raspap/MPNetWire/MPNetWire.php && php -l net/raspap/MPNetWire/templates/main.php
          python3 -m json.tool net/raspap/MPNetWire/manifest.json >/dev/null
          git clone -q --depth 1 https://github.com/JebetrexxMC/samp-packet-proxy /tmp/spp
          pip install -q pytest pytest-mock && (cd /tmp/spp && python3 -m pytest -q --deselect test_pack_scan.py::TestUDPServer::test_handles_invalid_server_address_and_returns_false)   # that upstream test fails on its own
      - name: mpprobe.py
        run: |
          pip install -q uvloop trio
          for l in asyncio uvloop trio; do timeout 60 python3 net/py/mpprobe.py -w net/wires.txt --loop $l | tail -2 || true; done

  gns:
    # GameNetworkingSockets lane test (fork, FetchContent); optional
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net/gns
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libprotobuf-dev protobuf-compiler libssl-dev ninja-build
      - run: cmake -S net/gns -B /tmp/gns -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/gns && timeout 60 /tmp/gns/mpgns

  deploy:
    # Docker image + k8s / compose files
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /net/
            /src/net/
          sparse-checkout-cone-mode: false
      - run: docker build -f net/k8s/Dockerfile -t mpnet:ci .
      - name: yaml + json
        run: |
          python3 -c "import yaml,glob,json; [list(yaml.safe_load_all(open(f))) for f in glob.glob('net/k8s/*.yaml')+glob.glob('net/*/docker-compose.yml')]; json.load(open('net/k8s/10-mpnet.conflist')); print('ok')"

  dotnet:
    # mpnet-dotnetty (DotNetty): build, NetWire ping against a local echo, query the crossplay server
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - working-directory: net/dotnet
        run: |
          dotnet build -c Release
          python3 -c "import socket;s=socket.socket(2,2);s.bind(('127.0.0.1',7796));[s.sendto(*s.recvfrom(64)) for _ in range(50)]" &
          sleep 1
          dotnet run -c Release --no-build -- 127.0.0.1 7796 --ping
          dotnet run -c Release --no-build -- wap-fresh.tun.ply.gg 56616 || true

  pulse:
    # MPNetPulse (Pulse fork) on macOS
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: net
      - working-directory: net/swift-pulse
        run: swift build

  status:
    needs: build
    if: vars.NETWIRE != 'off' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.shift != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 358
    concurrency:
      group: netwire-status
      cancel-in-progress: false
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /net/
            /src/net/
          sparse-checkout-cone-mode: false
      - run: make -C net
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: build mplatency
        working-directory: net/go
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mplatency" ./mplatency
      - name: Probe every 5 minutes (~5h50m)
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while :; do
            # re-read main's wires.txt every round: a wire added while the shift runs is probed too
            curl -fsSL "https://raw.githubusercontent.com/${REPO}/main/net/wires.txt" -o wires.txt 2>/dev/null || cp net/wires.txt wires.txt
            python3 net/tools/sources.py 20 > dyn.txt || true
            rm -rf out; mkdir -p out
            curl -fsSL "https://raw.githubusercontent.com/${REPO}/netwire-status/history.json" -o prev.json 2>/dev/null || echo '{}' > prev.json
            net/build/mpnetd probe -w wires.txt -w dyn.txt --samples 5 --from "GitHub Actions" -o out/wires.json 2> probe.log || true
            tail -n +1 probe.log | head -80
            if [ -s out/wires.json ] && python3 net/tools/render.py out prev.json; then
              # mplatency: 5 samples per wire (avg / min / max / jitter / loss + location) -> README card
              timeout 120 "$RUNNER_TEMP/mplatency" -once -rounds 5 -every 2s -wires wires.txt -json lat.json -quiet > lat.log 2>&1 || true
              [ -s lat.json ] && python3 net/tools/render_latency.py lat.json out || tail -5 lat.log
              ( cd out
                git init -q -b netwire-status
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -qm "netwire $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" netwire-status || true )
            fi
            [ $(( $(date +%s) + 300 )) -lt $end ] || break
            sleep 280
          done

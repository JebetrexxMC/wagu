# MP NetWire 24/7 (networking/): probes every wire - region brokers (HiveMQ), public lobby (Mosquitto /
# HiveMQ / EMQX), EMQX ports, region VPS game ports, Oracle / XDP / relay boxes, MP Crossplay (open.mp),
# the default + featured + custom servers in the MP lobby and the top open.mp / SA-MP servers - every
# 5 minutes and force-pushes the result to the `netwire-status` branch (one commit, main stays clean):
# wires.json, history.json (24 h), netwire.svg (README card) and badge-*.json (shields.io endpoint badges).
# The page mpsamp-open.github.io/network.html reads the same files.
# Same long-shift pattern as live-status.yml: one run stays up ~5h50m and loops itself; the cron only
# starts the next shift (queued, never cancelling the running one), so the status never stops.
# A new wire = a new line in networking/wires.txt; the next round picks it up (the file is re-read).
# Pings are measured from the GitHub runner (US / EU data centres), not from a phone: use them to see
# what is up and which path is fastest, not as the ping a player in the Philippines gets.
# Turn it off: repository variable NETWIRE = off.
name: MP NetWire 24/7

on:
  push:
    branches: [main]
    paths: ['networking/**', '.github/workflows/netwire-247.yml']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      shift:
        description: 'Run the 24/7 status loop (off = build + test only)'
        required: false
        default: 'on'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            networking
            src/net
          sparse-checkout-cone-mode: false
      - name: Build (host)
        run: make -C networking
      - name: Test (parser, probes, relay)
        run: make -C networking test
      - name: Build for Android (Termux / adb shell)
        run: make -C networking android NDK=$ANDROID_NDK_LATEST_HOME && ls -la networking/build/android/*/mpnetd
      - name: One probe round
        run: |
          python3 networking/tools/sources.py 10 > dyn.txt || true
          networking/build/mpnetd probe -w networking/wires.txt -w dyn.txt --from "GitHub Actions (build check)" -o wires.json || true
          python3 - <<'PY'
          import json; d = json.load(open("wires.json"))
          print("%d wires, %d probed, %d up, %d green" % (d["total"], d["probed"], d["up"], d["green"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mpnetd
          path: |
            networking/build/mpnetd
            networking/build/android
          retention-days: 14

  swift:
    # MPNet Swift package (Moya): build + tests on macOS, only when the code changes (not every cron round)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: networking/swift
      - name: swift build + test
        working-directory: networking/swift
        run: swift build && swift test

  status:
    needs: build
    if: vars.NETWIRE != 'off' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.shift != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 358
    concurrency:
      group: netwire-status
      cancel-in-progress: false
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            networking
            src/net
          sparse-checkout-cone-mode: false
      - run: make -C networking
      - name: Probe every 5 minutes (~5h50m)
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while :; do
            # re-read main's wires.txt every round: a wire added while the shift runs is probed too
            curl -fsSL "https://raw.githubusercontent.com/${REPO}/main/networking/wires.txt" -o wires.txt 2>/dev/null || cp networking/wires.txt wires.txt
            python3 networking/tools/sources.py 20 > dyn.txt || true
            rm -rf out; mkdir -p out
            curl -fsSL "https://raw.githubusercontent.com/${REPO}/netwire-status/history.json" -o prev.json 2>/dev/null || echo '{}' > prev.json
            networking/build/mpnetd probe -w wires.txt -w dyn.txt --samples 5 --from "GitHub Actions" -o out/wires.json 2> probe.log || true
            tail -n +1 probe.log | head -80
            if [ -s out/wires.json ] && python3 networking/tools/render.py out prev.json; then
              ( cd out
                git init -q -b netwire-status
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -qm "netwire $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" netwire-status || true )
            fi
            [ $(( $(date +%s) + 300 )) -lt $end ] || break
            sleep 280
          done

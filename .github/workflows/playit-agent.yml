# 5.02.51: our own playit agent, built from source (github.com/JebetrexxMC/playit-agent, fork of
# playit-cloud/playit-agent) for MP Crossplay 24/7. server/playit_agent.py uses these builds first and
# falls back to the playit 2.0.2 binaries uploaded in release v5.02.30.
#   playitd   = the agent (tunnel daemon)      playit-cli = the claim / key / tunnel tool
# Only the agent is open source: the tunnel servers and the agent keys stay on playit.gg (a free account).
name: playit agent (MP build)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'playit-agent branch / tag / commit'
        default: 'master'
  push:
    branches: [main]
    paths: ['.github/workflows/playit-agent.yml']
  schedule:
    - cron: '30 3 * * 1'   # every Monday: picks up new commits on the fork

permissions:
  contents: write

concurrency:
  group: playit-agent
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JebetrexxMC/playit-agent
          ref: ${{ inputs.ref || 'master' }}
          path: playit-agent
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            playit-agent/target
          key: playit-${{ matrix.arch }}-${{ hashFiles('playit-agent/Cargo.lock') }}
      - name: Build playitd + playit-cli
        working-directory: playit-agent
        run: |
          cargo build --release --locked --package playitd --package playit-cli
          mkdir -p ../out
          cp target/release/playitd "../out/mp-playitd-linux-${{ matrix.arch }}"
          cp target/release/playit-cli "../out/mp-playit-cli-linux-${{ matrix.arch }}"
          strip ../out/* || true
          "../out/mp-playitd-linux-${{ matrix.arch }}" --help | head -n 3
          echo "$(git rev-parse --short HEAD)" > ../out/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: playit-${{ matrix.arch }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish to the playit-mp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p up
          find art -type f -name 'mp-*' -exec cp {} up/ \;
          c=$(cat art/playit-amd64/commit.txt 2>/dev/null || echo '?')
          (cd up && sha256sum mp-* > SHA256SUMS.txt)
          notes="Our own playit agent for MP Crossplay 24/7, built from github.com/JebetrexxMC/playit-agent @ $c.
          playitd = the agent, playit-cli = claim / key / tunnels. Used by server/playit_agent.py on the 24/7 host."
          gh release view playit-mp -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create playit-mp -R "$GITHUB_REPOSITORY" --title "playit agent (MP build)" --notes "$notes" --latest=false
          gh release edit playit-mp -R "$GITHUB_REPOSITORY" --notes "$notes" --latest=false
          gh release upload playit-mp -R "$GITHUB_REPOSITORY" up/* --clobber

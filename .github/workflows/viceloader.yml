name: VICE Loader
# 5.00.04: builds ViceLoader.apk (viceloader/build_apk.sh: NDK + aapt2 + javac + d8 + apksigner) with the
# libMP in bin/ bundled. Signing key: repository secrets VL_KEYSTORE (base64 of a .jks / .p12) + VL_KEYPASS.
# Without them a new key is made for that run (an update then needs an uninstall first).
# The APK is an artifact of the run; with "release" set it is also added to that GitHub release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also attach the APK to this release tag (e.g. v5.00.04, empty = no)"
        required: false
        default: ""
  push:
    paths:
      - 'viceloader/**'
      - 'bin/libMP32.so'
      - 'bin/libMP64.so'
      - '.github/workflows/viceloader.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK parts
        run: |
          set -e
          sudo apt-get install -y -qq ninja-build > /dev/null
          SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        env:
          KS_B64: ${{ secrets.VL_KEYSTORE }}
          KS_PASS: ${{ secrets.VL_KEYPASS }}
        run: |
          set -e
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vl.jks"; echo "KEYPASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE=$RUNNER_TEMP/vl.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No VL_KEYSTORE secret: signing with a new key made for this run"
          fi
      - name: Build ViceLoader.apk
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          OUT_APK=$PWD/ViceLoader.apk bash viceloader/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ViceLoader
          path: ViceLoader.apk
      - name: Attach to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" ViceLoader.apk --clobber

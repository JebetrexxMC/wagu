name: Build MonetLoader for MP

# MP: MonetLoaderOSS lives in this repo (MonetLoaderOSS/, from JebetrexxMC/MonetLoaderOSS). Builds
# libmonetloader.so for both ABIs (the build that is embedded in libMP as src/embed/monetloader/<abi>/) and checks
# that every Lua file of MonetLoader's dist/ and of assets/MP/moonloader (lua_scripts_loader.lua, mp_zip, mp_pcpaths)
# parses with LuaJIT. The lua_scripts loader host test runs too.

on:
  workflow_dispatch:
  push:
    paths:
      - 'MonetLoaderOSS/**'
      - 'assets/MP/moonloader/lua_scripts_loader.lua'
      - 'assets/MP/moonloader/lib/mp_zip.lua'
      - 'assets/MP/moonloader/lib/mp_pcpaths.lua'
      - 'test/lua_scripts_loader_test.lua'
      - '.github/workflows/monetloader.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MonetLoaderOSS
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib ninja-build zip lua-filesystem
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: LuaJIT from source (JebetrexxMC/LuaJIT v2.1)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone --depth 1 -b v2.1 https://github.com/JebetrexxMC/LuaJIT /tmp/LuaJIT
          bash tools/build_luajit.sh /tmp/LuaJIT
      - name: Lua syntax check (host LuaJIT)
        run: |
          make -C /tmp/LuaJIT/src -j4 >/dev/null
          bad=0
          while IFS= read -r -d '' f; do
            if ! /tmp/LuaJIT/src/luajit -b "$f" /dev/null 2>/tmp/err; then echo "::warning file=$f::$(cat /tmp/err)"; bad=$((bad+1)); fi
          done < <(find dist ../assets/MP/moonloader/lua_scripts_loader.lua ../assets/MP/moonloader/lib/mp_zip.lua ../assets/MP/moonloader/lib/mp_pcpaths.lua -name '*.lua' -print0)
          echo "$bad file(s) not LuaJIT-parsable"
      - name: lua_scripts loader test
        working-directory: .
        run: /tmp/LuaJIT/src/luajit test/lua_scripts_loader_test.lua
      - name: Build libmonetloader.so (arm64-v8a, armeabi-v7a)
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S . -B build-$ABI -G Ninja -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build-$ABI -j4 --target monetloader
            mkdir -p out/$ABI && cp build-$ABI/libmonetloader.so out/$ABI/
          done
          ls -la out/*
      - name: Lua libraries (dist)
        run: |
          mkdir -p out && cd dist && zip -qr9 ../out/monetloader-dist.zip . && cd .. && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: monetloader-mp
          path: MonetLoaderOSS/out/
          if-no-files-found: error

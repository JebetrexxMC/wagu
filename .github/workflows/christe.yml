name: AML Multiplayer
# 5.02.76: builds the Christe Multiplayer APK (christe/, no Gradle: aapt2 + javac + d8 + apksigner).
# Signing key: repository secrets CHRISTE_KEYSTORE (base64 of a .jks / .p12) + CHRISTE_KEYPASS. Without
# them a new key is made for that run (fine for testing; an update then needs an uninstall first).
# The APK is an artifact of the run; with "release" set it is also added to that GitHub release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also attach the APK to this release tag (e.g. v3.50, empty = no)"
        required: false
        default: ""
  push:
    paths:
      - 'christe/**'
      - '.github/workflows/christe.yml'
      - 'bin/libMP32.so'
      - 'bin/libMP64.so'
      - 'bin/libCoopFusion32.so'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK parts
        run: |
          set -e
          SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Signing key
        env:
          KS_B64: ${{ secrets.CHRISTE_KEYSTORE }}
          KS_PASS: ${{ secrets.CHRISTE_KEYPASS }}
        run: |
          set -e
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/christe.jks"; echo "KEYPASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No CHRISTE_KEYSTORE secret: signing with a new key made for this run"
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/christe.jks" -storepass "$P" -keypass "$P" -alias christe \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AML Multiplayer, O=ThirtyFoxMC" > /dev/null
            echo "::add-mask::$P"; echo "KEYPASS=$P" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE=$RUNNER_TEMP/christe.jks" >> "$GITHUB_ENV"
      - name: Build
        run: |
          SDK=$ANDROID_HOME OBB=1 bash christe/build.sh
          mv christe/AMLMultiplayer.apk christe/main.*.com.christe.mp.obb .
          unzip -l AMLMultiplayer.apk | grep -E "classes.dex|assets/www/index.html|assets/libs"
      - uses: actions/upload-artifact@v4
        with:
          name: AMLMultiplayer
          path: |
            AMLMultiplayer.apk
            main.*.com.christe.mp.obb
          if-no-files-found: error
      - name: Attach to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" AMLMultiplayer.apk --clobber

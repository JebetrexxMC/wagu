# MP 5.02.70: a small lab for the MP network side (https://github.com/JebetrexxMC/containerlab).
#   phone (client) --- relay --- server
# Bad mobile links are made with netem (see README) so lag / loss handling can be tested without a phone.
name: mp-lab
topology:
  nodes:
    server:
      kind: linux
      image: alpine:3.20
      exec:
        - apk add -q socat
        - ip addr add 10.77.2.2/24 dev eth1
        - ip route add 10.77.1.0/24 via 10.77.2.1
        # UDP echo on 7777 = stand-in for the game port (put the real server image here)
        - sh -c "socat -T 30 UDP4-RECVFROM:7777,fork EXEC:cat >/dev/null 2>&1 &"
    relay:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 10.77.1.1/24 dev eth1
        - ip addr add 10.77.2.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
    phone:
      kind: linux
      image: alpine:3.20
      exec:
        - apk add -q socat
        - ip addr add 10.77.1.2/24 dev eth1
        - ip route add 10.77.2.0/24 via 10.77.1.1
  links:
    - endpoints: ["phone:eth1", "relay:eth1"]
    - endpoints: ["relay:eth2", "server:eth1"]

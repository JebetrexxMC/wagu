# MP NetWire on Kubernetes: the status watcher (HTTP 8090) and a UDP relay in front of an open.mp / SA-MP server.
#   docker build -f net/k8s/Dockerfile -t ghcr.io/jebetrexxmc/mpnetd:latest . && docker push ...
#   kubectl apply -f net/k8s/mpnet.yaml -f net/k8s/networkpolicy.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: mpnet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpnet-watch
  namespace: mpnet
  labels: { app: mpnet, role: watch }
spec:
  replicas: 1
  selector: { matchLabels: { app: mpnet, role: watch } }
  template:
    metadata: { labels: { app: mpnet, role: watch } }
    spec:
      containers:
        - name: mpnetd
          image: ghcr.io/jebetrexxmc/mpnetd:latest
          args: ["watch", "-w", "/etc/mpnet/wires.txt", "-o", "/tmp/netwire", "-i", "60", "--http", "8090"]
          ports: [{ name: http, containerPort: 8090, protocol: TCP }]
          readinessProbe: { httpGet: { path: /wires.json, port: http }, initialDelaySeconds: 20, periodSeconds: 30 }
          resources: { requests: { cpu: 20m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: mpnet-watch, namespace: mpnet }
spec:
  selector: { app: mpnet, role: watch }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpnet-relay
  namespace: mpnet
  labels: { app: mpnet, role: relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: mpnet, role: relay } }
  template:
    metadata: { labels: { app: mpnet, role: relay } }
    spec:
      containers:
        - name: mpnetd
          image: ghcr.io/jebetrexxmc/mpnetd:latest
          # replace the upstream with your game server (several -u = the relay picks the best one)
          args: ["relay", "-l", "7777", "-u", "wap-fresh.tun.ply.gg:56616", "--kind", "samp", "--http", "8091"]
          ports:
            - { name: game, containerPort: 7777, protocol: UDP }
            - { name: http, containerPort: 8091, protocol: TCP }
          resources: { requests: { cpu: 50m, memory: 16Mi }, limits: { cpu: "1", memory: 128Mi } }
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: mpnet-relay, namespace: mpnet }
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local       # keep the player's real address (bans, per-player upstream)
  selector: { app: mpnet, role: relay }
  ports: [{ name: game, port: 7777, targetPort: game, protocol: UDP }]

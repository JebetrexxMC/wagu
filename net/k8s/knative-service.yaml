# Knative Serving (fork github.com/JebetrexxMC/serving): the HTTP side of NetWire scaled to zero.
# mpnet-beast (/query?host=&port= for the website) only runs while someone asks, then scales back to 0.
# Needs Knative Serving on the cluster (kn quickstart / serving-core.yaml). UDP can't run on Knative
# (HTTP / gRPC only), so the relay stays a normal Deployment in mpnet.yaml.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mpnet-query
  namespace: mpnet
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "50"
    spec:
      containerConcurrency: 100
      containers:
        - image: ghcr.io/jebetrexxmc/mpnetd:latest
          command: ["/usr/local/bin/mpnet-beast"]
          args: ["-p", "8080"]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health } }
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { memory: 128Mi } }

[package]
name = "mp-launcher"
version = "1.0.0"
description = "MP Launcher for PC - SA-MP / open.mp server browser and MP Crossplay 24/7"
authors = ["JebetrexxMC"]
license = "MIT"
repository = "https://github.com/JebetrexxMC/wagu"
edition = "2021"

[build-dependencies]
# Tauri from the JebetrexxMC fork (tauri-apps/tauri, dev branch, Tauri 2)
tauri-build = { git = "https://github.com/JebetrexxMC/tauri", branch = "dev", features = [] }

[dependencies]
tauri = { git = "https://github.com/JebetrexxMC/tauri", branch = "dev", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
# plain Win32 injection (CreateProcessW suspended + LoadLibraryW in a remote thread); dll-syringe needed nightly Rust.
# The launcher is built as 32-bit (i686-pc-windows-msvc) like gta_sa.exe, so kernel32!LoadLibraryW has the same address in both.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_Security"] }
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Christe Multiplayer</title>
<link rel="stylesheet" href="css/christe.css">
</head>
<body>
<!-- boot: Dragon Codex Boot style hand-off (your own date2/resources/startup.mp4, or the built-in animation) -->
<div id="boot">
  <video id="bootVid" playsinline muted class="hide"></video>
  <div class="bootArt" id="bootArt">
    <div class="grid"></div>
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="ring" cx="60" cy="60" r="50"/>
      <path class="carc" d="M83 39 A31 31 0 1 0 83 81"/>
      <path class="cross" d="M60 36 V84 M48 52 H72"/>
    </svg>
    <div class="bootTitle"><span>CHRISTE</span><b>MULTIPLAYER</b></div>
    <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="bootStep" id="bootStep">Starting...</div>
  </div>
  <button class="bootSkip" id="bootSkip">Skip</button>
</div>

<div id="app" class="hide">
  <aside id="side">
    <div class="brand"><img src="img/logo.png" alt=""><div><b>CHRISTE</b><span>MULTIPLAYER</span></div></div>
    <nav id="nav">
      <a data-page="home" class="on"><svg><use href="#i-home"/></svg>Home</a>
      <a data-page="internet"><svg><use href="#i-globe"/></svg>Internet</a>
      <a data-page="favorites"><svg><use href="#i-star"/></svg>Favorites</a>
      <a data-page="explore"><svg><use href="#i-compass"/></svg>Explore Community</a>
    </nav>
    <div class="sideHead">COMMUNITIES</div>
    <div id="commList" class="commList"></div>
    <nav class="sideFoot">
      <a data-page="about"><svg><use href="#i-info"/></svg>About</a>
      <a data-page="settings"><svg><use href="#i-gear"/></svg>Settings</a>
    </nav>
  </aside>
  <main id="main">
    <header id="top">
      <div class="search"><svg><use href="#i-search"/></svg><input id="q" placeholder="Search servers, communities, host:port" autocomplete="off"></div>
      <button class="ib" id="regionBtn" title="Region"><svg><use href="#i-pin"/></svg><span id="regionLbl">Auto</span></button>
      <button class="ib" id="refreshBtn" title="Refresh servers"><svg><use href="#i-refresh"/></svg></button>
      <button class="ib" id="bellBtn" title="Notifications"><svg><use href="#i-bell"/></svg><i class="dot hide" id="bellDot"></i></button>
      <button class="ib" id="gearBtn" title="Quick settings"><svg><use href="#i-gear"/></svg></button>
      <button class="avatar" id="avatarBtn" title="Profile"><span id="avatarImg" class="av guest"><svg><use href="#i-user"/></svg></span><span id="avatarName">Guest</span></button>
    </header>
    <div id="netBar" class="netBar hide"></div>
    <section id="page"></section>
  </main>
</div>

<div id="pop" class="pop hide"></div>
<div id="auth" class="hide"></div>
<div id="dlg" class="dlgWrap hide"></div>
<div id="toast" class="toast hide"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 16V11a6 6 0 1 0-12 0v5l-2 2h16zM10 21h4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.6 5"/></symbol>
  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5-2.7M14 10.3A10 10 0 0 1 19 13M2 9.5a15 15 0 0 1 4.5-2.8M10.5 5.1A15 15 0 0 1 22 9.5"/><circle cx="12" cy="20" r=".6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="i-discord" viewBox="0 0 24 24"><path d="M8 7.5c2.6-.8 5.4-.8 8 0M7 16.5c3.3 1.2 6.7 1.2 10 0M7 16.5 5.5 19C3.5 17.7 3 15 3.5 11c.6-2.6 1.7-4.6 4-5.5L8.5 7.5M17 16.5l1.5 2.5c2-1.3 2.5-4 2-8-.6-2.6-1.7-4.6-4-5.5l-1 2"/><circle cx="9.5" cy="12.5" r="1.2"/><circle cx="14.5" cy="12.5" r="1.2"/></symbol>
</svg>
<script src="js/mpauth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
